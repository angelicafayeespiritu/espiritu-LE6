<div class="main-wrapper">
  <!-- Black / Dark Hero Card -->
  <div class="hero-card">
    <h1 class="hero-title">Featured Articles</h1>
    <p class="hero-subtitle">Explore the latest technical discussions, articles, and community posts.</p>
  </div>

  <!-- Cards Grid -->
  <div class="posts-grid">
    <div class="post-card" *ngFor="let post of posts">
      <div>
        <div class="post-card-header"></div>
        
        <div class="post-card-content">
          <div class="meta-row">
            <span class="badge-dark">ARTICLE</span>
            <span class="read-time">3 min read</span>
          </div>

          <h2 class="post-title">{{ post.title }}</h2>
          <p class="post-body">{{ post.body }}</p>
        </div>
      </div>

      <div class="card-footer">
        <div class="author-chip">
          <div class="avatar-dark">{{ post.title.charAt(0).toUpperCase() }}</div>
          <span class="post-id">#{{ post.id }}</span>
        </div>

        <a [routerLink]="['/posts', post.id]" class="action-link">
          Read post <span>&rarr;</span>
        </a>
      </div>
    </div>
  </div>
</div>
