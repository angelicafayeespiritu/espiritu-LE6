<div class="auth-card">
  <h2>Welcome Back</h2>
  <p class="subtitle">Please enter your details to log in.</p>

  <form (ngSubmit)="onLogin()">
    <div class="form-group">
      <label for="username">Username or Email</label>
      <input type="text" id="username" [(ngModel)]="credentials.username" name="username" placeholder="Enter your username" required />
    </div>

    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" [(ngModel)]="credentials.password" name="password" placeholder="Enter your password" required />
    </div>

    <button type="submit" class="btn-submit">Sign In</button>
  </form>
</div>
